<!DOCTYPE html>
<html lang="ru">
</head>
<body>
  <div class="todo-container">
    <div class="todo-header">
      <h1>📋 Список дел</h1>
      <p style="color: #64748b; margin-top: 0.5rem;">Добавляй, копируй, редактируй — данные сохранятся</p>
    </div>

    <form class="todo-form" id="todo-form">
      <input type="text" class="todo-input" id="todo-input" placeholder="Например: Изучить JavaScript" autocomplete="off">
      <button type="submit" class="todo-add-button">➕ Добавить</button>
    </form>

    <ul class="todo-list" id="todo-list"></ul>
  </div>

  <template id="todo-item-template">
    <li class="todo-item">
      <span class="todo-item-text"></span>
      <div class="todo-buttons">
        <button class="todo-button todo-button-edit" aria-label="Редактировать">✏️</button>
        <button class="todo-button todo-button-duplicate" aria-label="Копировать">📋</button>
        <button class="todo-button todo-button-delete" aria-label="Удалить">🗑️</button>
      </div>
    </li>
  </template>

  <script>
    const formElement = document.getElementById('todo-form');
    const inputElement = document.getElementById('todo-input');
    const listElement = document.getElementById('todo-list');
    const template = document.getElementById('todo-item-template');

    let items = [
      'Выучить основы JavaScript',
      'Сделать проект To-Do',
      'Разобраться с localStorage',
      'Написать функцию createItem',
      'Добавить обработчики событий',
      '✨ Сдать проект на проверку ✨'
    ];

    function loadTasks() {
      const savedTasks = localStorage.getItem('todoTasks');
      if (savedTasks) {
        try {
          const parsed = JSON.parse(savedTasks);
          if (Array.isArray(parsed)) {
            return parsed;
          }
        } catch(e) {
          console.warn('Ошибка парсинга localStorage');
        }
      }
      return [...items]; 
    }

    function saveTasks(tasksArray) {
      localStorage.setItem('todoTasks', JSON.stringify(tasksArray));
    }

    function getTasksFromDOM() {
      const itemsNamesElements = document.querySelectorAll('.todo-item-text');
      const tasks = [];
      itemsNamesElements.forEach((element) => {
        tasks.push(element.textContent);
      });
      return tasks;
    }

    function createItem(taskText) {
      const clone = template.content.cloneNode(true);
      const taskElement = clone.querySelector('.todo-item');
      const textElement = taskElement.querySelector('.todo-item-text');
      const editButton = taskElement.querySelector('.todo-button-edit');
      const duplicateButton = taskElement.querySelector('.todo-button-duplicate');
      const deleteButton = taskElement.querySelector('.todo-button-delete');

      textElement.textContent = taskText;

      deleteButton.addEventListener('click', () => {
        taskElement.remove(); 
        const updatedTasks = getTasksFromDOM();
        saveTasks(updatedTasks);
      });

      duplicateButton.addEventListener('click', () => {
        const itemName = textElement.textContent; 
        const newItem = createItem(itemName);     
        
        listElement.prepend(newItem);
        
        const allTasks = getTasksFromDOM();
        saveTasks(allTasks);
      });

      editButton.addEventListener('click', () => {
        textElement.setAttribute('contenteditable', 'true');
        textElement.focus();
      });

      textElement.addEventListener('blur', () => {
        if (textElement.getAttribute('contenteditable') === 'true') {
          textElement.setAttribute('contenteditable', 'false');
          textElement.textContent = textElement.textContent.trim();
          
          const updatedTasks = getTasksFromDOM();
          saveTasks(updatedTasks);
        }
      });

      textElement.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && textElement.getAttribute('contenteditable') === 'true') {
          e.preventDefault();
          textElement.blur();
        }
      });

      return taskElement; 
    }

    function handleFormSubmit(event) {
      event.preventDefault();
      
      const taskText = inputElement.value.trim();
      if (taskText === '') {
        alert('Пожалуйста, введите текст задачи');
        return;
      }
      
      const newTaskElement = createItem(taskText);
      
      listElement.prepend(newTaskElement);
      
      inputElement.value = '';
      const currentTasks = getTasksFromDOM();
      saveTasks(currentTasks);
    }

    function renderAllTasks() {
      listElement.innerHTML = '';
      
      const tasksArray = loadTasks();
      
      tasksArray.forEach((task) => {
        const taskElement = createItem(task);
        listElement.append(taskElement);
      });
    }

    function initApp() {
      renderAllTasks();
      
      formElement.addEventListener('submit', handleFormSubmit);
    }
    
    document.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
